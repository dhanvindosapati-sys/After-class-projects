<html>
    <head>
      <style>
        .group1{
            color:dodgerblue
            font-size: 15px;
            
        }
        .text1{
            font-family: Arial, Helvetica, sans-serif;
            color:deeppink;
        }
        div{
          height: 100px;
          Width: 200px;
          background-color: blue ;

        }
        #d0506{
            transform: rotateX(180deg);
            transform: scaleX(2);
        }
        h1{
        text-decoration: overline;
        text-transform: capitalize;
      }
      h2{
        text-decoration: line-through;
        text-transform: lowercase;

      }
      h3{
        text-decoration: underline;
        text-transform: uppercase;
      }
      h4{
        text-decoration: overline underline;
        text-transform: none;
      }
       .text{
              text-shadow: 3px 2px 3px red
        }
        .box{
            box-shadow: 4px 3px 5px cyan;
        }
      </style>
    </head>
    <body>
        <h1>Dhanvin</h1>
        <p class="group1">Welcome To CSS</p>
        <p class="text1">We are learning CSS today </p>
          <div>Bike</div>
        <div id="d0506">My favorite bike is Harley-Davidson</div>
            <h1>Bikes</h1>
        <h2>Cars</h2>
        <h3>Food</h3>
        <h4>Sports</h4>
         <h1 class="text">Cars</h1>
        <h1 class="box">Sports</h1>

    </body>
</html>
